<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; }
    .slide { width: 1920px; height: 1080px; padding: 110px; background: #fff; color: #202124; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-top: 60px; }
    .box { min-height: 280px; padding: 28px; border: 2px solid #ddd; border-radius: 16px; }
    .fill { display: block; width: 100%; height: 150px; margin-top: 18px; border: 2px dashed #bbb; background: #fafafa; }
  </style>
</head>
<body>
  <section class="slide" data-ppt-slide>
    <h1>Vùng nội dung điền sau</h1>
    <div class="grid">
      <div class="box">
        <strong>Tham chiếu</strong>
        <span class="fill" data-ppt-placeholder="reference-01" data-ppt-placeholder-prompt="Người dùng tự điền tham chiếu"></span>
      </div>
      <div class="box">
        <strong>Công nghệ đã kiểm chứng</strong>
        <span class="fill" data-ppt-placeholder="verified-technology-01" aria-label="Người dùng tự điền công nghệ đã kiểm chứng"></span>
      </div>
    </div>
  </section>
</body>
</html>
